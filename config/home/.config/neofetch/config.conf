# Neofetch config - compact macOS-focused system summary.

print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    prin "Build" "$(sw_vers -buildVersion 2>/dev/null)"
    info "Kernel" kernel
    info "Packages" packages
    info "Shell" shell
    info "Terminal" term
    info "Resolution" resolution

    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Disk" disk
    info "Battery" battery

    prin "Locale" "${LANG:-unknown}"
    info cols
}

# Title
title_fqdn="off"

# OS / kernel
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"

# Uptime / shell
uptime_shorthand="on"
shell_path="off"
shell_version="on"

# Packages
package_managers="tiny"

# Hardware
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"

# Memory / disk
memory_percent="on"
memory_unit="gib"
disk_show=("/")
disk_subtitle="mount"
disk_percent="on"

# Display
image_backend="ascii"
ascii_distro="macos"
ascii_colors=(2 3 1 1 5 4)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"

# Color blocks
color_blocks="on"
block_range=(0 15)
block_width=3
block_height=1
col_offset="auto"

# Progress bars
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15
bar_color_elapsed="distro"
bar_color_total="distro"

# Misc
stdout="off"
